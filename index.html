    <script>
      // Applied before paint so the correct theme is set without a flash,
      // mirroring the resolution logic in src/config/themes.js.
      (function () {
        try {
          var mode = localStorage.getItem('aco.theme') || 'dark';
          var applied =
            mode === 'system'
              ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
              : mode;
          document.documentElement.setAttribute('data-theme', applied);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
